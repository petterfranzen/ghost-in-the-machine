name: Pages

on:
  push:
    branches: [main]
    paths: ["nights/**", "crew/**", "LOG.md", "scripts/build-index.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the site from each night's committed dist/
        run: |
          set -euo pipefail
          mkdir -p _site
          for d in nights/*/dist; do
            [ -f "$d/index.html" ] || continue
            n=$(basename "$(dirname "$d")")
            cp -r "$d" "_site/$n"
          done
          cp -r crew _site/crew && rm -f _site/crew/README.md
          python3 scripts/build-index.py _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

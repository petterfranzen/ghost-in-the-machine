name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a PR's superseded runs so a stale push cannot hold a runner for the
# full 360-minute default; never cancel a main run (it may be deploying).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks git --no-banner --redact .

  scope:
    name: Agent PRs stay in their lane
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Night and task branches touch only nights/, research/, crew/, hq/, talks/ and LOG.md
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in night/*|task/*) ;; *) echo "Not an agent branch ($HEAD_REF); no lane check."; exit 0;; esac
          outside=$(git diff --name-only "origin/$BASE_REF...HEAD" | grep -vE '^(nights/|research/|crew/|hq/|talks/|LOG\.md$)' || true)
          if [ -n "$outside" ]; then echo "Agent branch changes files outside its lane:"; echo "$outside"; exit 1; fi
          echo "ok"

  nights:
    name: Build changed nights
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install mise (pinned, checksum-verified)
        env:
          MISE_VERSION: "2026.10.19"
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSLO "https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/mise-v${MISE_VERSION}-linux-x64"
          curl -fsSLO "https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/SHASUMS256.txt"
          grep " \./mise-v${MISE_VERSION}-linux-x64\$\| mise-v${MISE_VERSION}-linux-x64\$" SHASUMS256.txt | sed 's# \./# #' | sha256sum -c -
          sudo install -m 0755 "mise-v${MISE_VERSION}-linux-x64" /usr/local/bin/mise
      - name: Build and check each changed night
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          nights=$(git diff --name-only "origin/$BASE_REF...HEAD" | awk -F/ '$1=="nights" && NF>2 && $2 !~ /^_/ {print $2}' | sort -u)
          [ -n "$nights" ] || { echo "No night folders changed."; exit 0; }
          for n in $nights; do
            d="nights/$n"
            echo "::group::$n"
            [ -d "$d" ] || { echo "$d removed; skipping"; echo "::endgroup::"; continue; }
            [[ "$n" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$ ]] || { echo "Folder name must be YYYY-MM-DD-slug: $n"; exit 1; }
            for f in README.md build.sh dist/index.html; do [ -e "$d/$f" ] || { echo "$d is missing $f"; exit 1; }; done
            grep -qF "| $n |" LOG.md || { echo "LOG.md has no line for $n"; exit 1; }
            ( cd "$d"
              if [ -f mise.toml ] || [ -f .mise.toml ] || [ -f .tool-versions ]; then mise trust -a && mise install; fi
              timeout 25m mise exec -- bash build.sh )
            [ -s "$d/dist/index.html" ] || { echo "build.sh did not produce dist/index.html"; exit 1; }
            echo "::endgroup::"
          done

  loads:
    # "One build a night" is a public promise: a night only counts once Pages
    # serves it. Pages publishes each night's committed dist/ as it is, so this
    # serves exactly that (no rebuild, which could hide a file that was built
    # but never committed, as on 13 Nov) and fails on any 404, console error,
    # page error or blank page.
    name: Committed night loads
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Playwright Chromium (pinned)
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.65.0
          npx playwright install chromium
          # System packages come from the runner's Ubuntu mirror; a dead mirror must
          # not fail the check (flight-tracker #214).
          timeout 6m npx playwright install-deps chromium || echo "install-deps failed; trying without"
          cp "$GITHUB_WORKSPACE/scripts/check-night-loads.mjs" /tmp/pw/
      - name: Serve each changed night's committed dist/ and load it
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          nights=$(git diff --name-only "origin/$BASE_REF...HEAD" | awk -F/ '$1=="nights" && NF>2 && $2 !~ /^_/ {print $2}' | sort -u)
          [ -n "$nights" ] || { echo "No night folders changed."; exit 0; }
          status=0
          for n in $nights; do
            d="nights/$n/dist"
            [ -f "$d/index.html" ] || { echo "$n: no committed dist/index.html; the Build job reports it"; continue; }
            python3 -m http.server 8765 --bind 127.0.0.1 -d "$d" >/dev/null 2>&1 &
            srv=$!
            for _ in $(seq 1 20); do curl -fs http://127.0.0.1:8765/ >/dev/null && break; sleep 0.5; done
            node /tmp/pw/check-night-loads.mjs http://127.0.0.1:8765/ "$n" || status=1
            kill "$srv"; wait "$srv" 2>/dev/null || true
          done
          exit $status

  index:
    name: Landing page renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p /tmp/site && python3 scripts/build-index.py /tmp/site && test -s /tmp/site/index.html

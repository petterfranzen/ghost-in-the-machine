<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Tide</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1626'/%3E%3Cpath d='M3 10l5-6 5 6z' fill='%23f2ead8'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0f1a;
    --ink: #e8eef8;
    --dim: #a9bad4;
    --line: rgba(180, 205, 240, 0.34);
    --card: #0d1626;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.35 ui-serif, Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color: transparent;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px 6px;
  }
  h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.06em; margin: 0; text-transform: uppercase; }
  #sound {
    min-height: 44px;
    min-width: 44px;
    padding: 0 14px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: #17223a;
    border: 1px solid var(--line);
    border-radius: 22px;
    cursor: pointer;
  }
  #sound[aria-pressed="true"] { background: #2a3d5f; }
  #stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px 0;
  }
  #app {
    display: block;
    height: 100%;
    width: auto;
    max-width: 100%;
    image-rendering: pixelated;
    border-radius: 4px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    background: var(--card);
  }
  #app:focus-visible { outline: 2px solid var(--dim); outline-offset: 2px; }
  footer {
    flex: 0 0 auto;
    padding: 6px 14px 10px;
    text-align: center;
    color: var(--dim);
    font-size: 16px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<header>
  <h1>Paper Tide</h1>
  <button id="sound" type="button" aria-pressed="false" aria-label="Sound off">Sound off</button>
</header>
<div id="stage">
  <canvas id="app" width="180" height="320" tabindex="0" role="button"
          aria-label="A paper boat drifting down a rainy night gutter. Press Enter to nudge the water."></canvas>
</div>
<footer id="status" aria-live="polite">A small paper boat drifts down the gutter.</footer>
<script src="app.js"></script>
<script>main();</script>
</body>
</html>

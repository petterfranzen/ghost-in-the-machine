<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d16">
<title>Emberstones</title>
<style>
  :root { --ink: #cfd6ea; --dim: #7b86a6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d16; }
  body {
    display: flex; align-items: center; justify-content: center;
    font: 500 13px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink); -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #stage { position: relative; width: 100vw; height: 100dvh; max-height: 100dvh; overflow: hidden;
           border-radius: 2px; box-shadow: 0 0 0 1px rgba(120,140,200,.07), 0 24px 80px rgba(0,0,0,.55); }
  canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none; cursor: crosshair;
  }
  .ui { position: absolute; pointer-events: none; }
  #title {
    left: max(16px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top));
    letter-spacing: .18em; font-size: 11px; text-transform: uppercase;
    color: #93a0c4; opacity: .85; transition: opacity 1.4s ease;
  }
  #title b { font-weight: 600; color: #d8c9a8; letter-spacing: .22em; }
  #title.gone { opacity: 0; }
  #say {
    left: 0; right: 0; top: 15%;
    text-align: center; font-size: 12px; color: #9aa5c6; opacity: 0;
    transition: opacity .9s ease; padding: 0 26px; letter-spacing: .04em;
    text-shadow: 0 1px 8px rgba(6,8,14,.9);
  }
  #say.on { opacity: .8; }
  #sound {
    pointer-events: auto; position: absolute;
    right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top));
    min-width: 48px; min-height: 48px; padding: 0 14px;
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid rgba(190,205,240,.28); border-radius: 999px;
    background: rgba(14,18,30,.55); color: #b9c4e2;
    font: 600 11px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .14em;
    text-transform: uppercase; cursor: pointer; backdrop-filter: blur(6px);
    transition: border-color .3s, color .3s, background .3s;
  }
  #sound:hover { border-color: rgba(215,225,255,.5); }
  #sound[aria-pressed="true"] { color: #ffe6b8; border-color: rgba(255,210,140,.55); background: rgba(38,28,20,.6); }
  #sound svg { width: 17px; height: 17px; display: block; }
  #sound .bars { display: none; }
  #sound[aria-pressed="true"] .bars { display: block; }
  #sound[aria-pressed="true"] .cross { display: none; }
  #foot {
    left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; gap: 10px; justify-content: center; align-items: center;
  }
  .btn {
    pointer-events: auto; min-height: 44px; min-width: 44px; padding: 0 16px;
    border: 1px solid rgba(180,195,230,.22); border-radius: 999px;
    background: rgba(12,16,26,.42); color: #9aa6c6;
    font: 600 11px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .16em;
    text-transform: uppercase; cursor: pointer; backdrop-filter: blur(6px);
    transition: color .25s, border-color .25s, opacity .25s;
  }
  .btn:hover { color: #d6deff; border-color: rgba(200,215,255,.4); }
  .btn:disabled { opacity: .3; cursor: default; }
  @media (max-width: 520px) { #foot { gap: 8px; } .btn { padding: 0 13px; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="A ring of standing stones at night"></canvas>
  <div id="title" class="ui">ember<b>stones</b></div>
  <button id="sound" aria-pressed="false" aria-label="Sound is off. Turn sound on.">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z"/>
      <g class="cross"><path d="M16 9.5l4.5 5M20.5 9.5l-4.5 5"/></g>
      <g class="bars"><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18.2 6.9a7.4 7.4 0 0 1 0 10.2"/></g>
    </svg>
    <span class="lbl">sound</span>
  </button>
  <div id="say" class="ui"></div>
  <div id="foot" class="ui">
    <button id="undo" class="btn" title="take back the last stone">undo</button>
    <button id="again" class="btn" title="set the circle back">again</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>

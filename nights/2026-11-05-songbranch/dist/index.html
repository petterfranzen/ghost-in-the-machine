<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<meta name="description" content="Songbranch — a pixel-art tree at dusk. Tap a bird and it hops to the next branch and sings one soft note.">
<title>Songbranch</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <header>
    <h1>Songbranch</h1>
    <p class="sub">a tree at dusk, and four small birds</p>
  </header>

  <div class="stage-wrap">
    <canvas id="stage" width="176" height="312" tabindex="0" role="application"
            aria-label="A pixel-art tree at dusk with four birds on its branches. Tap a bird and it hops to another branch and sings one soft note. Tap the trunk and the whole tree settles."
            aria-describedby="hint"></canvas>
  </div>

  <p id="caption" aria-live="polite">four birds are settling in for the night</p>

  <div class="foot">
    <p id="hint">tap a bird &middot; tap the trunk &middot; tap the sky</p>
    <button id="sound" type="button" aria-pressed="false">
      <span class="glyph" aria-hidden="true">&#9834;</span><span class="label">sound off</span>
    </button>
  </div>

</main>
<script src="./wasm.js"></script>
<script src="./app.js"></script>
</body>
</html>

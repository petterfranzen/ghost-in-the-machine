<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pebblewick</title>
<meta name="description" content="A calm shelf of moss and stone: tilt it with a thumb and roll a glowing pebble through every light into its hollow.">
<meta name="theme-color" content="#0a1420">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a1420'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f6d999'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="hud">
  <header class="top">
    <h1 id="level">Shelf 1 of 6: First Roll</h1>
    <button id="sound" class="sound" type="button" aria-pressed="false">Sound off</button>
    <p id="goal" class="goal">Lights 0 of 1 - the hollow still sleeps</p>
  </header>
  <p id="hint" class="hint" aria-live="polite">Drag a thumb on the shelf to tilt it, and roll the pebble over the light.</p>
  <div class="stage">
    <canvas id="board" role="application" tabindex="0" aria-label="The shelf. Drag to tilt it, or use the tilt buttons and the arrow keys."></canvas>
    <div id="banner" class="banner" hidden>
      <p id="banner-text" aria-live="polite"></p>
      <button id="next" type="button">Next shelf</button>
    </div>
  </div>
  <footer class="controls">
    <div id="pad" class="pad" role="group" aria-label="Tilt the shelf">
      <button type="button" data-dir="up" aria-label="Tilt the shelf up">&#9650;</button>
      <button type="button" data-dir="left" aria-label="Tilt the shelf left">&#9664;</button>
      <button type="button" data-dir="down" aria-label="Tilt the shelf down">&#9660;</button>
      <button type="button" data-dir="right" aria-label="Tilt the shelf right">&#9654;</button>
    </div>
    <div class="act">
      <button id="undo" type="button">Undo the roll</button>
      <button id="restart" type="button">Restart shelf</button>
    </div>
  </footer>
  <p id="note" class="note" role="status" aria-live="polite">The shelf is quiet. Turn sound on to hear it.</p>
</main>
<script src="./matter.min.js"></script>
<script type="module" src="./app/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1118">
<title>Summerkeep — a calm night pantry</title>
<style>
  :root { color-scheme: dark; --ink: #d9c9ae; --dim: #8a7f6d; --panel: #1c2430; --edge: #33404f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink);
    background: radial-gradient(ellipse 70% 60% at 50% 46%, #18222e 0%, #0f151d 55%, #0a0e14 100%);
    font-family: ui-serif, "Iowan Old Style", Georgia, Cambria, serif; }
  #app { height: 100dvh; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 10px 12px; }
  header { text-align: center; line-height: 1.25; }
  h1 { margin: 0; font-size: 1.05rem; letter-spacing: .12em; text-transform: uppercase; color: #e8d9bd; }
  #shelf { margin: 2px 0 0; font-size: .95rem; color: #c8b696; }
  #progress { margin: 0; font-size: .78rem; color: var(--dim); }
  #stage { position: relative; flex: 1 1 auto; min-height: 0; display: grid; place-items: center; }
  canvas { display: block; border-radius: 8px; image-rendering: pixelated;
    box-shadow: 0 0 0 1px var(--panel), 0 20px 44px rgba(0,0,0,.5); touch-action: none; }
  footer { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button { min-height: 44px; min-width: 44px; padding: 10px 16px; font: inherit; font-size: .85rem;
    color: var(--ink); background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
    cursor: pointer; }
  button:focus-visible { outline: 2px solid #9fd0c0; outline-offset: 2px; }
  #sound { border-color: #4d6b5c; background: #22302b; }
  #hint { margin: 0; min-height: 1.1em; font-size: .78rem; color: #9d9180; text-align: center; }
  #card[hidden], #boot[hidden] { display: none; }
  #card { position: absolute; inset: auto; max-width: min(320px, 82%); padding: 18px 20px 20px;
    text-align: center; background: rgba(20,27,37,.95); border: 1px solid var(--edge); border-radius: 16px;
    box-shadow: 0 18px 40px rgba(0,0,0,.55); }
  #card h2 { margin: 0 0 6px; font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; color: #e8d9bd; }
  #card p { margin: 0 0 14px; font-size: .82rem; color: #bfae90; }
  #boot { position: fixed; inset: 0; display: grid; place-content: center; gap: 8px; text-align: center;
    background: #0c1118; padding: 24px; z-index: 5; }
  #boot h2 { margin: 0; font-size: 1.1rem; letter-spacing: .14em; text-transform: uppercase; color: #e8d9bd; }
  #boot p { margin: 0; font-size: .82rem; color: var(--dim); }
  @media (max-height: 620px) { #hint { display: none; } }
</style>
</head>
<body>
<main id="app">
  <header>
    <h1 id="title">Summerkeep</h1>
    <p id="shelf">First Jars</p>
    <p id="progress">Opening the pantry…</p>
  </header>
  <div id="stage">
    <canvas id="scene" width="380" height="600" aria-label="A pantry of shelves and jars of preserved berries"></canvas>
    <div id="card" hidden>
      <h2 id="card-title">Shelf kept</h2>
      <p id="card-text"></p>
      <button id="card-button" type="button">Next shelf</button>
    </div>
  </div>
  <footer>
    <button id="sound" type="button" aria-live="polite">Sound: off</button>
    <button id="undo" type="button">Undo</button>
    <button id="restart" type="button">Restart</button>
  </footer>
  <p id="hint">Tap a jar, then tap a shelf</p>
</main>
<div id="boot">
  <h2>Summerkeep</h2>
  <p id="boot-note">Warming the pantry…</p>
</div>
<script src="ruby-wasm-wasi.umd.js"></script>
<script>
  (async () => {
    const note = (m) => { const el = document.getElementById("boot-note"); if (el) el.textContent = m; };
    try {
      const res = await fetch("ruby.wasm.gz");
      if (!res.ok) throw new Error("ruby.wasm.gz " + res.status);
      const gz = new Blob([await res.arrayBuffer()]).stream().pipeThrough(new DecompressionStream("gzip"));
      const mod = await WebAssembly.compile(await new Response(gz).arrayBuffer());
      const { DefaultRubyVM } = window["ruby-wasm-wasi"];
      const { vm } = await DefaultRubyVM(mod);
      note("Lining the shelves…");
      const source = await fetch("app.rb");
      if (!source.ok) throw new Error("app.rb " + source.status);
      await vm.evalAsync(await source.text());
      vm.eval("Main.start");
      document.getElementById("boot").style.display = "none";
    } catch (err) {
      note("The pantry would not open: " + (err && err.message ? err.message : err));
      console.error(err);
    }
  })();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightbloom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='14' fill='%230b1220' stroke='%2346c98a' stroke-opacity='0.5' stroke-width='3'/%3E%3Cg fill='%2393e9b3'%3E%3Ccircle cx='32' cy='20' r='7'/%3E%3Ccircle cx='32' cy='44' r='7'/%3E%3Ccircle cx='20' cy='32' r='7'/%3E%3Ccircle cx='44' cy='32' r='7'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='5' fill='%23f4f8ff'/%3E%3C/svg%3E" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="hud" id="hud">
  <header class="bar">
    <p class="level" id="level">Meadow 1 of 8</p>
    <p class="goal" id="goal">Flowers open 0 of 0</p>
  </header>
  <p class="hint" id="hint"></p>
  <div class="stage">
    <canvas id="board" width="384" height="384" role="img" aria-label="A night meadow of flowers. Tap a flower to open it and its neighbours."></canvas>
    <section class="banner" id="banner" hidden>
      <p class="banner-text" id="banner-text"></p>
      <button type="button" id="next" class="primary">Next meadow</button>
    </section>
  </div>
  <footer class="bar controls">
    <button type="button" id="undo">Undo</button>
    <button type="button" id="restart">Restart</button>
    <button type="button" id="sound" aria-pressed="false">Sound off</button>
  </footer>
  <p class="note" id="note" role="status" aria-live="polite"></p>
</main>
<script type="module" src="./app/main.js"></script>
</body>
</html>

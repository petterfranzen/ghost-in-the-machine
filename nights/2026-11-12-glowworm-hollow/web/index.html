<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glowworm Hollow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0a12'/%3E%3Ccircle cx='8' cy='7' r='2.4' fill='%23ffe58a'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --ink: #e8e2d2; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #07070c;
    color: var(--ink);
    font: 16px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #c {
    display: block; background: #07070c;
    image-rendering: pixelated;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    outline: none;
  }
  #c:focus-visible { outline: 2px solid rgba(255, 214, 138, .75); outline-offset: -2px; }
  #title {
    position: fixed; top: max(10px, env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    margin: 0; font-size: 16px; font-weight: 500; letter-spacing: .06em;
    color: rgba(232, 226, 210, .72); pointer-events: none;
    text-shadow: 0 1px 6px rgba(0, 0, 0, .85);
  }
  #dock {
    position: fixed; right: max(12px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    left: max(12px, env(safe-area-inset-left));
    display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px;
    pointer-events: none;
  }
  #sound {
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 9px;
    min-height: 44px; min-width: 44px; padding: 0 16px;
    font: inherit; font-size: 16px; letter-spacing: .02em;
    color: var(--ink); background: rgba(20, 20, 34, .78);
    border: 1px solid rgba(232, 226, 210, .42); border-radius: 999px;
    backdrop-filter: blur(6px); cursor: pointer;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  #sound > * { pointer-events: none; }
  #sound .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #7c7c94; transition: background .25s ease, box-shadow .25s ease;
  }
  #sound:hover { background: rgba(32, 30, 48, .85); }
  #sound[aria-pressed="true"] {
    color: #ffeec4; border-color: rgba(255, 214, 138, .72); background: rgba(46, 36, 24, .82);
  }
  #sound[aria-pressed="true"] .dot { background: #ffd98a; box-shadow: 0 0 9px rgba(255, 217, 138, .9); }
  .sr {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    #sound, #sound .dot { transition: none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="c" width="180" height="320" role="button" tabindex="0"
      aria-label="A dark cave. Glow-worms sleep along the ceiling. Press Enter or Space to wake one."></canvas>
  </div>
  <h1 id="title">glowworm hollow</h1>
  <div id="dock">
    <button id="sound" type="button" aria-pressed="false" aria-label="Sound off">
      <span class="dot"></span><span class="label">Sound off</span>
    </button>
  </div>
  <p id="live" class="sr" role="status" aria-live="polite"></p>
  <script src="app.js"></script>
</body>
</html>

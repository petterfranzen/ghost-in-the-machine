<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060b09">
<title>Snow Garden — a quiet snowy garden at dusk</title>
<meta name="description" content="A calm pixel-art garden under a slow snowfall. Tap the snow and a small walker trudges there, leaving footprints that fill in behind them; rest a thumb on the bench or the lantern and the garden answers. A fox crosses if you stand still.">
<link rel="icon" type="image/svg+xml" href="INLINE_FAVICON">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="scene" id="scene">
  <h1 class="sr-only">Snow Garden</h1>
  <canvas id="stage" tabindex="0" role="button" aria-describedby="hint"
    aria-label="A quiet snowy garden at dusk. Tap the snow and a small walker trudges to that spot, leaving footprints that fill in slowly behind them. Tap the lantern post to light it and warm the snow around it; tap the stone bench to call the fox. A fox crosses the garden on its own if you stand still. Press Enter to send the walker across the garden."></canvas>
  <p class="hint" id="hint" role="status" aria-live="polite"></p>
  <div class="dock">
    <p class="caption">snow garden</p>
    <button class="btn" id="sound" type="button" aria-pressed="false">&#9834; off</button>
  </div>
</main>
<script src="app.js" defer></script>
</body>
</html>
